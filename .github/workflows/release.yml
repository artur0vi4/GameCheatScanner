# Автоматическая сборка GameCheatScanner.exe на Windows при публикации релиза.
# Срабатывает, когда создаётся новый Release (не draft). Собирает автономный
# .exe теми же флагами PyInstaller, что и build.py, и прикрепляет его к релизу.
name: Build Windows .exe

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write   # нужно для загрузки .exe в ассеты релиза

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build .exe with PyInstaller
        # Флаги идентичны build.py: один файл, без консоли, запрос прав админа,
        # numpy целиком в сборке.
        run: |
          python -m PyInstaller --noconfirm --clean `
            --onefile `
            --windowed `
            --uac-admin `
            --name GameCheatScanner `
            --collect-all numpy `
            main.py

      - name: Verify .exe exists
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\GameCheatScanner.exe")) {
            Write-Error "dist\GameCheatScanner.exe не найден — сборка не удалась"
            exit 1
          }
          $size = (Get-Item "dist\GameCheatScanner.exe").Length
          Write-Host "Собран .exe, размер: $size байт"

      - name: Upload .exe to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/GameCheatScanner.exe
          fail_on_unmatched_files: true

      - name: Upload .exe as artifact (manual runs)
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: GameCheatScanner-exe
          path: dist/GameCheatScanner.exe
